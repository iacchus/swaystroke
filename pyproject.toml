[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "swaystroke"
version     = "0.1.0"
description = "A modular Python-based gesture recognition tool for Sway/SwayFX"
readme      = "README.md"
requires-python = ">=3.7"

dependencies = [
    "i3ipc",
]

[project.scripts]
swaystroke = "swaystroke.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swaystroke*"]
